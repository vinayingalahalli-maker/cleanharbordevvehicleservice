$kind: http-example
request:
  url: "{{baseUrl}}/vehicles/:id"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  pathVariables:
    id: "1"
  body:
    type: text
    content: |-
      {
        "nickName": "The Lisa Marie",
        "vin": "4M2DV11W4RDJ53329",
        "make": "Mercury",
        "model": "Villager",
        "year": "1994",
        "miles": 159999
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "this is good request"
      }
order: 1000
