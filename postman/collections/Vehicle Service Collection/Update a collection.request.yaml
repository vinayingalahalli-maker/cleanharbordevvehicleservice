$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: "1"
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159999
    }
scripts:
  - type: afterResponse
    code: |-
      

      pm.test("Response has JSON body", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains updated fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("vin");
          pm.expect(json).to.have.property("make");
          pm.expect(json).to.have.property("model");
      });
    language: text/javascript
settings: {}
examples: ./.resources/Update a collection.resources/examples
order: 3000
