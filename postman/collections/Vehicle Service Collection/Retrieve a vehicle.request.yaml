$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has JSON body", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains vehicle fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("vin");
          pm.expect(json).to.have.property("make");
          pm.expect(json).to.have.property("model");
      });
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
