openapi: 3.0.0
info:
  title: Vehicle Service Collection
  version: 1.0.0
  description: >-
    This collection covers the core CRUD operations for the **Vehicle Service
    API**, providing a complete set of endpoints to create, retrieve, update,
    and delete vehicle resources.


    ### Endpoints


    | Method | Endpoint | Description |

    |--------|----------|-------------|

    | `POST` | `/vehicles` | Create a new vehicle |

    | `GET` | `/vehicles/:id` | Retrieve a vehicle by its ID |

    | `PATCH` | `/vehicles/:id` | Partially update an existing vehicle |

    | `PUT` | `/vehicles/:id` | Fully replace an existing vehicle |

    | `DELETE` | `/vehicles/:id` | Delete a vehicle by its ID |


    ### Response Coverage


    Each request includes saved examples that cover both success and error
    scenarios:


    - **2xx** — `200 Success`, `201 Created`, `204 No Content`

    - **4xx** — `400 Missing/Bad Request`, `404 Not Found`, `409 Conflict
    (Vehicle already exists)`

    - **5xx** — `500 Unexpected Error`


    This makes the collection well-suited for both active development and mock
    server usage.


    ### Configuration


    All requests use the `{{baseUrl}}` variable. Make sure your active
    environment has `baseUrl` set to the correct server URL before sending
    requests.
servers:
  - url: '{{baseUrl}}'
paths:
  /vehicles:
    get:
      summary: Get all vehicles
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nickName:
                      type: string
                    vin:
                      type: string
                    make:
                      type: string
                    model:
                      type: string
                    year:
                      type: string
                      format: utc-millisec
                    miles:
                      type: integer
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
    post:
      summary: Create a vehicle
      responses:
        '201':
          description: 201 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: string
              example:
                id: '{{$randomUUID}}'
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159,864
        '400':
          description: 400 - Missing required attribute
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Request body missing required attribute: vin'
        '409':
          description: 409 - Vehicle already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: >-
                  Vehicle with VIN JN8AZ2KR1AT169594 already exists. Existing
                  vehicle ID: 2
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickName:
                  type: string
                vin:
                  type: string
                make:
                  type: string
                model:
                  type: string
                year:
                  type: string
                miles:
                  type: integer
            example:
              nickName: The Lisa Marie
              vin: 4M2DV11W4RDJ53329
              make: Mercury
              model: Villager
              year: '1994'
              miles: 159864
  /vehicles/{id}:
    get:
      summary: Retrieve a vehicle
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: integer
              example:
                id: 1
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159864
        '404':
          description: 404 - Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Vehicle with id: 0 not found.'
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: '2'
    patch:
      summary: Update a collection
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: integer
              example:
                id: 1
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159999
        '400':
          description: 400 - Bad request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Bad request body.
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickName:
                  type: string
                vin:
                  type: string
                make:
                  type: string
                model:
                  type: string
                year:
                  type: string
                miles:
                  type: integer
            example:
              nickName: The Lisa Marie
              vin: 4M2DV11W4RDJ53329
              make: Mercury
              model: Villager
              year: '1994'
              miles: 159999
    delete:
      summary: Delete a vehicle
      responses:
        '204':
          description: 204 - Success
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
    put:
      summary: Update Vehicle
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: this is good request
        '500':
          description: Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
